name: Capture README screenshot

on:
  push:
    branches:
      - docs/pr-24-readme-screenshot
    paths:
      - ".github/workflows/capture-readme-screenshot.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout screenshot branch
        uses: actions/checkout@v7
        with:
          ref: docs/pr-24-readme-screenshot

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install project
        run: npm ci

      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          npm run dev > /tmp/nourishflow-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nourishflow-server.log
          exit 1

      - name: Capture full-page screenshot
        run: |
          mkdir -p docs
          node --input-type=module <<'EOF'
          import { chromium } from "playwright";

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({
            viewport: { width: 1440, height: 1000 },
            deviceScaleFactor: 1,
          });

          await page.goto("http://127.0.0.1:8080", {
            waitUntil: "networkidle",
          });

          await page.screenshot({
            path: "docs/nourishflow-preview.png",
            fullPage: true,
          });

          await browser.close();
          EOF

      - name: Export preview for verification
        run: base64 -w0 docs/nourishflow-preview.png > docs/nourishflow-preview.base64.txt

      - name: Commit screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/nourishflow-preview.png docs/nourishflow-preview.base64.txt

          if git diff --cached --quiet; then
            echo "Screenshot already current."
            exit 0
          fi

          git commit -m "docs: capture NourishFlow preview"
          git push
