name: Quality

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Static checks and characterization tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: npm run check

      - name: Validate semantic HTML
        run: npx --yes html-validate@10.12.0 index.html

      - name: Install responsive browser smoke dependency
        run: npm install --no-save --package-lock=false playwright@1.63.0

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run responsive browser smoke
        run: |
          npm run dev > /tmp/healthy-lifestyle-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT

          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8080/ > /dev/null; then
              break
            fi
            sleep 0.25
          done

          curl --fail --silent http://127.0.0.1:8080/ > /dev/null
          node tests/reflow.browser.mjs
