name: Quality

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Static, domain, and browser quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: npm run check

      - name: Validate semantic HTML
        run: npx --yes html-validate@10.12.0 index.html

      - name: Install browser quality dependencies
        run: npm install --no-save --package-lock=false playwright@1.63.0 @axe-core/playwright@4.13.0 sharp@0.35.4

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run browser quality gates
        run: |
          npm run dev > /tmp/nourishflow-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT

          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8080/ > /dev/null; then
              break
            fi
            sleep 0.25
          done

          curl --fail --silent http://127.0.0.1:8080/ > /dev/null
          node tests/reflow.browser.mjs
          node tests/accessibility.browser.mjs
          node tests/cross-browser.browser.mjs
          node tests/capture-visuals.browser.mjs
          node scripts/build-brand-assets.mjs

      - name: Upload visual audit screenshots
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nourishflow-visual-audit
          path: |
            artifacts/visual-audit/*.png
            artifacts/brand/*.png
          if-no-files-found: error
          retention-days: 7
